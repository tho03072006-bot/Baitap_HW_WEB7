# ===== Cong chay ung dung =====
server.port=8082

# ===== View resolver cho JSP =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Ket noi SQL Server (DB webst2, localhost:1433) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst2;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${db.password:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Upload file (icon Category, hinh Product) =====
storage.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.config.import=optional:file:./application-secrets.properties

# ===== Swagger 3 =====
springdoc.swagger-ui.path=/swagger-ui/index.html
