# ===== Cong chay ung dung =====
server.port=8082

# ===== View resolver cho JSP (Buoc: trang JSP dat trong /WEB-INF/views/) =====
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ===== Ket noi SQL Server (dung DB "webst2" da co san tren SQL Server localhost,1433) =====
# Bang du lieu dung rieng cho bai tap nay la HW7Categories / HW7Products (xem giai thich
# trong Category.java) nen KHONG dam vao du lieu cac bai tap khac dang dung chung DB webst2.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst2;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# Mat khau THAT khong luu o day - xem file application-secrets.properties (KHONG commit len Git)
spring.datasource.password=${db.password:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Cau hinh upload file (icon Category, hinh Product) =====
storage.location=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Nap them file chua mat khau that (khong commit len Git), neu file khong ton tai thi bo qua
spring.config.import=optional:file:./application-secrets.properties

# ===== Swagger 3 / OpenAPI (springdoc) =====
springdoc.swagger-ui.path=/swagger-ui/index.html
